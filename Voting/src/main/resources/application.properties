spring.application.name=voting
voting.service1.url=http://service-java:8081/api/v1/routes/optimal-order
voting.service2.url=http://service-ruby:3001/route
voting.service3.url=http://service-python:8082/logistic/route
server.port=9000

logging.level.org.springframework.web=INFO
# Desactivamos handlers verbosos de WebFlux que imprimen cada ResponseEntity / adaptador HTTP.
logging.level.org.springframework.web.reactive.result.method.annotation.ResponseEntityResultHandler=OFF
logging.level.org.springframework.http.server.reactive.HttpWebHandlerAdapter=OFF
logging.level.com.arquitectura.voting=INFO

# === Actuator / Health & Readiness ===
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.prometheus.enabled=true


# === Logging pattern con traceId y spanId para correlacionar logs en trazas distribuidas ===
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level --- [%X{appName:-${spring.application.name:-}}] [%thread] [trace=%X{traceId:-} span=%X{spanId:-}] %logger{40} : %msg%n

otel.traces.exporter=none
otel.logs.exporter=none
